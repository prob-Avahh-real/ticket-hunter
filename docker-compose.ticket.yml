version: "3.8"

# ============================================
# 抢票小程序 — Ticket Hunter
# 一键启动: docker compose -f docker-compose.ticket.yml up -d
# ============================================

services:
  # ---- PostgreSQL (复用已有卷，独立数据库) ----
  ticket-db:
    image: postgres:16-alpine
    restart: always
    container_name: ticket-db
    environment:
      POSTGRES_USER: ticket
      POSTGRES_PASSWORD: ${TICKET_DB_PASSWORD:-ticket_dev}
      POSTGRES_DB: ticket_hunter
    volumes:
      - ticket_pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ticket -d ticket_hunter"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---- Redis (复用于抢票队列/锁) ----
  ticket-redis:
    image: redis:7-alpine
    restart: always
    container_name: ticket-redis
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - ticket_redisdata:/data
    ports:
      - "127.0.0.1:6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---- 后端 API ----
  ticket-backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: always
    container_name: ticket-backend
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      DATABASE_URL: postgresql://ticket:${TICKET_DB_PASSWORD:-ticket_dev}@ticket-db:5432/ticket_hunter
      REDIS_URL: redis://ticket-redis:6379
      JWT_SECRET: ${TICKET_JWT_SECRET:-dev-secret-change-in-prod}
      PORT: "4000"
    ports:
      - "127.0.0.1:4000:4000"
    depends_on:
      ticket-db:
        condition: service_healthy
      ticket-redis:
        condition: service_healthy

  # ---- 数据聚合 Worker ----
  ticket-worker:
    build:
      context: ./worker
      dockerfile: Dockerfile
    restart: always
    container_name: ticket-worker
    environment:
      DATABASE_URL: postgresql://ticket:${TICKET_DB_PASSWORD:-ticket_dev}@ticket-db:5432/ticket_hunter
      REDIS_URL: redis://ticket-redis:6379
    depends_on:
      ticket-db:
        condition: service_healthy
      ticket-redis:
        condition: service_healthy

volumes:
  ticket_pgdata:
  ticket_redisdata:
